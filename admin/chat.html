<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Vinyl Run Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111110;
      --bg2: #1a1a18;
      --bg3: #222220;
      --ink: #f0ede6;
      --ink-muted: rgba(240,237,230,0.45);
      --accent: #EDF10C;
      --border: rgba(240,237,230,0.08);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-box h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .login-box span {
      font-size: 12px;
      color: var(--ink-muted);
    }
    .login-input {
      background: rgba(240,237,230,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      background: var(--accent);
      color: #111110;
      border: none;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.85; }
    #login-error {
      font-size: 12px;
      color: #ff6b6b;
      display: none;
    }

    /* App */
    #app {
      display: none;
      height: 100vh;
    }
    #app.visible { display: flex; }

    /* Sidebar */
    #sidebar {
      width: 280px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #refresh-btn {
      background: none;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px;
      transition: color 0.15s;
    }
    #refresh-btn:hover { color: var(--ink); }
    #conv-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(240,237,230,0.1) transparent;
    }
    .conv-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .conv-item:hover { background: rgba(240,237,230,0.03); }
    .conv-item.active { background: rgba(240,237,230,0.06); }
    .conv-item__name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 3px;
    }
    .conv-item__phone {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .conv-item__date {
      font-size: 11px;
      color: var(--ink-muted);
    }
    #conv-empty {
      padding: 32px 18px;
      font-size: 13px;
      color: var(--ink-muted);
      display: none;
    }

    /* Main */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #main-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--ink-muted);
    }
    #conv-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    #conv-view.visible { display: flex; }

    #conv-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #conv-header-name {
      font-size: 14px;
      font-weight: 500;
    }
    #conv-header-phone {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    #messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(240,237,230,0.1) transparent;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg--visitor {
      background: rgba(240,237,230,0.08);
      color: var(--ink);
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }
    .msg--admin {
      background: var(--accent);
      color: #111110;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .msg__time {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 4px;
      display: block;
    }
    .msg--admin .msg__time { text-align: right; }

    #reply-zone {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #reply-text {
      flex: 1;
      background: rgba(240,237,230,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    #reply-text:focus { border-color: var(--accent); }
    #reply-text::placeholder { color: rgba(240,237,230,0.2); }
    #reply-send {
      background: var(--accent);
      color: #111110;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      height: 42px;
    }
    #reply-send:hover { opacity: 0.85; }
    #reply-send:disabled { opacity: 0.4; cursor: default; }

    @media (max-width: 600px) {
      #sidebar { width: 100%; position: absolute; z-index: 10; background: var(--bg); }
      #sidebar.hidden { display: none; }
      #app.conv-open #sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <h1>VINYL RUN <span>Admin</span></h1>
      <p style="font-size:13px;color:var(--ink-muted);line-height:1.6;">Accès réservé. Entrez le mot de passe pour consulter les messages.</p>
      <input class="login-input" type="password" id="login-pwd" placeholder="Mot de passe" />
      <div id="login-error">Mot de passe incorrect.</div>
      <button class="login-btn" id="login-btn">Accéder</button>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>Messages</h2>
        <button id="refresh-btn" title="Rafraîchir">↻</button>
      </div>
      <div id="conv-list"></div>
      <div id="conv-empty">Aucun message pour l'instant.</div>
    </div>

    <div id="main">
      <div id="main-empty">Sélectionnez une conversation</div>
      <div id="conv-view">
        <div id="conv-header">
          <div id="conv-header-name"></div>
          <div id="conv-header-phone"></div>
        </div>
        <div id="messages-area"></div>
        <div id="reply-zone">
          <textarea id="reply-text" placeholder="Votre réponse…" rows="1"></textarea>
          <button id="reply-send">Envoyer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var pwd = '';
    var currentConvId = null;
    var pollInterval = null;
    var knownIds = new Set();

    // Login
    document.getElementById('login-btn').addEventListener('click', tryLogin);
    document.getElementById('login-pwd').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryLogin();
    });

    async function tryLogin() {
      var input = document.getElementById('login-pwd').value.trim();
      if (!input) return;
      // Vérifier en chargeant les conversations
      var res = await fetch('/api/chat-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_password: input }),
      });
      if (res.status === 403) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      pwd = input;
      sessionStorage.setItem('vr_admin_pwd', pwd);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      var convs = await res.json();
      renderConvList(convs);
      startAutoRefresh();
    }

    // Restaurer session
    var savedPwd = sessionStorage.getItem('vr_admin_pwd');
    if (savedPwd) {
      pwd = savedPwd;
      document.getElementById('login-pwd').value = pwd;
      tryLogin();
    }

    function renderConvList(convs) {
      var list = document.getElementById('conv-list');
      var empty = document.getElementById('conv-empty');
      list.innerHTML = '';
      if (!convs.length) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      convs.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
        var d = new Date(c.last_message_at);
        var dateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) +
                      ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        el.innerHTML =
          '<div class="conv-item__name">' + esc(c.visitor_name) + '</div>' +
          '<div class="conv-item__phone">' + esc(c.visitor_phone) + '</div>' +
          '<div class="conv-item__date">' + dateStr + '</div>';
        el.addEventListener('click', function () { openConv(c); });
        list.appendChild(el);
      });
    }

    async function openConv(c) {
      currentConvId = c.id;
      document.getElementById('conv-header-name').textContent = c.visitor_name;
      document.getElementById('conv-header-phone').textContent = c.visitor_phone;
      document.getElementById('main-empty').style.display = 'none';
      document.getElementById('conv-view').classList.add('visible');
      knownIds = new Set();
      await loadMessages();
      document.querySelectorAll('.conv-item').forEach(function (el, i) {
        el.classList.remove('active');
      });
      document.querySelectorAll('.conv-item').forEach(function (el) {
        if (el.querySelector('.conv-item__phone').textContent === c.visitor_phone) {
          el.classList.add('active');
        }
      });
    }

    async function loadMessages() {
      if (!currentConvId) return;
      var res = await fetch('/api/chat-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_password: pwd, conversation_id: currentConvId }),
      });
      if (!res.ok) return;
      var msgs = await res.json();
      var area = document.getElementById('messages-area');
      msgs.forEach(function (m) {
        if (!knownIds.has(m.id)) {
          knownIds.add(m.id);
          var el = document.createElement('div');
          el.className = 'msg msg--' + m.sender;
          var time = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          el.innerHTML = '<span>' + esc(m.body) + '</span><span class="msg__time">' + time + '</span>';
          area.appendChild(el);
        }
      });
      area.scrollTop = area.scrollHeight;
    }

    // Envoi réponse
    document.getElementById('reply-send').addEventListener('click', sendReply);
    document.getElementById('reply-text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
    });

    async function sendReply() {
      var msg = document.getElementById('reply-text').value.trim();
      if (!msg || !currentConvId) return;
      var btn = document.getElementById('reply-send');
      btn.disabled = true;
      document.getElementById('reply-text').value = '';

      await fetch('/api/chat-send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          conversation_id: currentConvId,
          message: msg,
          sender: 'admin',
          admin_password: pwd,
        }),
      });

      await loadMessages();
      btn.disabled = false;
    }

    // Refresh liste
    document.getElementById('refresh-btn').addEventListener('click', refreshList);

    async function refreshList() {
      var res = await fetch('/api/chat-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_password: pwd }),
      });
      if (res.ok) renderConvList(await res.json());
      if (currentConvId) loadMessages();
    }

    function startAutoRefresh() {
      setInterval(refreshList, 5000);
    }

    // Auto-resize reply textarea
    document.getElementById('reply-text').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
