name: Article images

# Déclenché par le push de blog/article-images.json (récap écrit par la routine).
# Pour chaque image, le récap fournit soit une "query" (mots-clés -> recherche Pexels API),
# soit une "source" (URL directe). Le runner GitHub a le réseau (contrairement au sandbox
# cloud de la routine). Les images choisies sont redimensionnées et réencodées :
#   - hero  -> hero.webp (1600, page) + hero-thumb.webp (600, carte) + hero.jpg (1600, og/RSS/mail)
#   - fig-N -> fig-N.webp (1200, page)
# WebP pour la page (perf) ; JPEG pour og:image/enclosure RSS/mail (le WebP casse sous Outlook
# et certains scrapers sociaux).
#
# NOUVEAUTÉ : blog/used-images.json tient le registre des IDs Pexels déjà utilisés sur le site.
# L'Action ne choisit que des résultats absents de ce registre (et distincts dans un même article),
# puis y ajoute les nouveaux IDs. Plus de "déjà-vu" ni de doublon.
#
# Fallback en cascade si une source/recherche échoue : Pexels vinyle éprouvé -> assets/mag03.jpg.
# Auteur du commit = johan.trigeard@gmail.com (membre équipe Vercel) : sinon le push bot est
# bloqué par Vercel (images 404).

on:
  push:
    branches: [main]
    paths:
      - 'blog/article-images.json'

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pillow
        run: pip install --quiet Pillow

      - name: Search, download, resize and reencode article images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, urllib.request, urllib.parse
          from io import BytesIO
          from PIL import Image

          RECAP  = 'blog/article-images.json'
          LEDGER = 'blog/used-images.json'
          API_KEY = os.environ.get('PEXELS_API_KEY', '').strip()

          WIDTHS = {'hero': 1600}
          DEFAULT_WIDTH = 1200
          THUMB = {'hero': ('hero-thumb', 600)}   # vignette carte mosaïque
          JPEG  = {'hero': ('hero', 1600)}        # og:image / enclosure RSS / mail

          NET_FALLBACK = 'https://images.pexels.com/photos/2746823/pexels-photo-2746823.jpeg?auto=compress&cs=tinysrgb&w=1600&fit=crop'
          LOCAL_FALLBACK = 'assets/mag03.jpg'

          def http_get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read()

          # Registre de nouveauté (IDs Pexels déjà utilisés sur le site).
          used = set()
          if os.path.exists(LEDGER):
              try:
                  used = set(json.load(open(LEDGER, encoding='utf-8')).get('pexels', []))
              except Exception:
                  used = set()
          picked = set()  # IDs choisis pendant ce run (évite les doublons intra-article)

          def pexels_search(query):
              if not API_KEY:
                  print("::warning::PEXELS_API_KEY absent — pas de recherche, fallback utilisé.")
                  return []
              url = 'https://api.pexels.com/v1/search?' + urllib.parse.urlencode(
                  {'query': query, 'per_page': 40, 'orientation': 'landscape', 'size': 'large'})
              try:
                  return json.loads(http_get(url, {'Authorization': API_KEY})).get('photos', [])
              except Exception as e:
                  print(f"::warning::recherche Pexels KO ('{query}') : {e}")
                  return []

          def resolve(im):
              """(image PIL, pexels_id|None) : query -> Pexels (1er résultat neuf), sinon source, sinon fallback."""
              q = im.get('query')
              if q:
                  for ph in pexels_search(q):
                      pid = ph.get('id')
                      if pid in used or pid in picked:
                          continue
                      try:
                          data = http_get(ph['src']['large2x'])
                          picked.add(pid)
                          print(f"{im['name']}: Pexels #{pid} pour '{q}'")
                          return Image.open(BytesIO(data)).convert('RGB'), pid
                      except Exception as e:
                          print(f"::warning::{im['name']}: download #{pid} KO : {e}")
              src = im.get('source')
              if src:
                  try:
                      return Image.open(BytesIO(http_get(src))).convert('RGB'), None
                  except Exception as e:
                      print(f"::warning::{im['name']}: source KO : {e}")
              try:
                  print(f"::warning::{im['name']}: fallback réseau")
                  return Image.open(BytesIO(http_get(NET_FALLBACK))).convert('RGB'), None
              except Exception:
                  print(f"::warning::{im['name']}: fallback local")
                  return Image.open(LOCAL_FALLBACK).convert('RGB'), None

          recap = json.load(open(RECAP, encoding='utf-8'))
          slug = recap['slug']
          out_dir = os.path.join('assets', 'articles', slug)
          os.makedirs(out_dir, exist_ok=True)

          def resized(img, width):
              if img.width > width:
                  h = round(img.height * width / img.width)
                  return img.resize((width, h), Image.LANCZOS)
              return img

          def save_webp(img, width, dest):
              resized(img, width).save(dest, 'WEBP', quality=82, method=6)
              print(f"  -> {dest} ({os.path.getsize(dest)//1024} Ko)")

          def save_jpeg(img, width, dest):
              resized(img, width).save(dest, 'JPEG', quality=84, optimize=True, progressive=True)
              print(f"  -> {dest} ({os.path.getsize(dest)//1024} Ko)")

          changed = []
          for im in recap['images']:
              name = im['name']
              img, _ = resolve(im)
              save_webp(img, WIDTHS.get(name, DEFAULT_WIDTH), os.path.join(out_dir, f'{name}.webp'))
              changed.append(os.path.join(out_dir, f'{name}.webp'))
              if name in THUMB:
                  tn, tw = THUMB[name]
                  save_webp(img, tw, os.path.join(out_dir, f'{tn}.webp'))
                  changed.append(os.path.join(out_dir, f'{tn}.webp'))
              if name in JPEG:
                  jn, jw = JPEG[name]
                  save_jpeg(img, jw, os.path.join(out_dir, f'{jn}.jpg'))
                  changed.append(os.path.join(out_dir, f'{jn}.jpg'))

          # Met à jour le registre de nouveauté.
          if picked:
              all_used = sorted(used | picked)
              json.dump({'pexels': all_used}, open(LEDGER, 'w', encoding='utf-8'), indent=2)
              changed.append(LEDGER)

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'Vinyl Run Agent'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'johan.trigeard@gmail.com'], check=True)
              subprocess.run(['git', 'add'] + changed, check=True)
              if subprocess.run(['git', 'diff', '--staged', '--quiet']).returncode != 0:
                  subprocess.run(['git', 'commit', '-m', f'feat(blog): images {slug}'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'main'], check=True)
                  print('Images committées et poussées.')
              else:
                  print('Aucun changement.')
          EOF
