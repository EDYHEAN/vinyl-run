name: Article images

# Déclenché par le push de blog/article-images.json (le récap écrit par la routine).
# Télécharge les images sources (le runner GitHub a le réseau, contrairement au sandbox
# cloud de la routine), les redimensionne et les réencode :
#   - hero       -> hero.webp (1600, page) + hero-thumb.webp (600, carte) + hero.jpg (1600, og/RSS/mail)
#   - fig-N      -> fig-N.webp (1200, page)
# WebP pour les images de page (perf). JPEG pour og:image + enclosure RSS car le WebP
# ne s'affiche pas dans plusieurs clients mail (Outlook) ni chez certains scrapers sociaux.
# Fallback en cascade si une source échoue : image vinyle réseau éprouvée -> assets/mag03.jpg.
#
# IMPORTANT : le commit est authoré johan.trigeard@gmail.com (membre de l'équipe Vercel).
# Un commit poussé par github-actions[bot] dont l'auteur n'est PAS membre de l'équipe est
# BLOQUÉ par Vercel (images en 404). Cf. même bug résolu sur MyFrenchTool.

on:
  push:
    branches: [main]
    paths:
      - 'blog/article-images.json'

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pillow
        run: pip install --quiet Pillow

      - name: Download, resize and reencode article images
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, urllib.request
          from io import BytesIO
          from PIL import Image

          RECAP = 'blog/article-images.json'

          # Largeur cible (px) de l'image principale selon son nom.
          WIDTHS = {'hero': 1600}
          DEFAULT_WIDTH = 1200
          # Le hero produit aussi une vignette (carte mosaïque) et un JPEG (og/RSS/mail).
          THUMB = {'hero': ('hero-thumb', 600)}
          JPEG = {'hero': ('hero', 1600)}

          # Fallback réseau : hero vinyle déjà éprouvé en prod (Pexels 2746823).
          NET_FALLBACK = 'https://images.pexels.com/photos/2746823/pexels-photo-2746823.jpeg?auto=compress&cs=tinysrgb&w=1600&fit=crop'
          # Fallback local ultime : photo boutique déjà dans le repo.
          LOCAL_FALLBACK = 'assets/mag03.jpg'

          with open(RECAP, encoding='utf-8') as f:
              recap = json.load(f)
          slug = recap['slug']
          out_dir = os.path.join('assets', 'articles', slug)
          os.makedirs(out_dir, exist_ok=True)

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read()

          def load_image(im):
              """Renvoie un objet PIL depuis : source -> fallback réseau -> fallback local."""
              for src in (im['source'], NET_FALLBACK):
                  try:
                      return Image.open(BytesIO(fetch(src))).convert('RGB'), src
                  except Exception as e:
                      print(f"::warning::{im['name']}: source KO ({src[:70]}) -> {e}")
              print(f"::warning::{im['name']}: fallback local {LOCAL_FALLBACK}")
              return Image.open(LOCAL_FALLBACK).convert('RGB'), LOCAL_FALLBACK

          def resized(img, width):
              if img.width > width:
                  h = round(img.height * width / img.width)
                  return img.resize((width, h), Image.LANCZOS)
              return img

          def save_webp(img, width, dest):
              resized(img, width).save(dest, 'WEBP', quality=82, method=6)
              print(f"  -> {dest} ({os.path.getsize(dest)//1024} Ko)")

          def save_jpeg(img, width, dest):
              resized(img, width).save(dest, 'JPEG', quality=84, optimize=True, progressive=True)
              print(f"  -> {dest} ({os.path.getsize(dest)//1024} Ko)")

          changed = []
          for im in recap['images']:
              name = im['name']
              img, used = load_image(im)
              print(f"{name}: source utilisée {used[:70]}")
              dest = os.path.join(out_dir, f'{name}.webp')
              save_webp(img, WIDTHS.get(name, DEFAULT_WIDTH), dest)
              changed.append(dest)
              if name in THUMB:
                  tname, twidth = THUMB[name]
                  tdest = os.path.join(out_dir, f'{tname}.webp')
                  save_webp(img, twidth, tdest)
                  changed.append(tdest)
              if name in JPEG:
                  jname, jwidth = JPEG[name]
                  jdest = os.path.join(out_dir, f'{jname}.jpg')
                  save_jpeg(img, jwidth, jdest)
                  changed.append(jdest)

          if changed:
              # Auteur = membre de l'équipe Vercel, sinon le déploiement du commit bot est bloqué.
              subprocess.run(['git', 'config', 'user.name', 'Vinyl Run Agent'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'johan.trigeard@gmail.com'], check=True)
              subprocess.run(['git', 'add'] + changed, check=True)
              if subprocess.run(['git', 'diff', '--staged', '--quiet']).returncode != 0:
                  subprocess.run(['git', 'commit', '-m', f'feat(blog): images {slug}'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'main'], check=True)
                  print('Images committées et poussées.')
              else:
                  print('Aucun changement d\'image.')
          EOF
