name: Article images

# Déclenché par le push de blog/article-images.json (le récap écrit par la routine).
# Télécharge les images sources (le runner GitHub a le réseau, contrairement au sandbox
# cloud de la routine), les redimensionne et les réencode en WebP léger, puis les commit
# en local dans assets/articles/{slug}/. En cas d'échec d'une source : fallback réseau
# (image vinyle éprouvée) puis fallback local (assets/mag03.jpg) — jamais d'image manquante.

on:
  push:
    branches: [main]
    paths:
      - 'blog/article-images.json'

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pillow
        run: pip install --quiet Pillow

      - name: Download, resize and reencode article images
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, urllib.request
          from io import BytesIO
          from PIL import Image

          RECAP = 'blog/article-images.json'

          # Largeur cible (px) de l'image principale selon son nom.
          WIDTHS = {'hero': 1600}
          DEFAULT_WIDTH = 1200
          # Le hero produit aussi une vignette pour la carte mosaïque du blog.
          THUMB = {'hero': ('hero-thumb', 600)}

          # Fallback réseau : hero vinyle déjà éprouvé en prod (Pexels 2746823).
          NET_FALLBACK = 'https://images.pexels.com/photos/2746823/pexels-photo-2746823.jpeg?auto=compress&cs=tinysrgb&w=1600&fit=crop'
          # Fallback local ultime : photo boutique déjà dans le repo.
          LOCAL_FALLBACK = 'assets/mag03.jpg'

          with open(RECAP, encoding='utf-8') as f:
              recap = json.load(f)
          slug = recap['slug']
          out_dir = os.path.join('assets', 'articles', slug)
          os.makedirs(out_dir, exist_ok=True)

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as res:
                  return res.read()

          def load_image(im):
              """Renvoie un objet PIL depuis : source -> fallback réseau -> fallback local."""
              for src in (im['source'], NET_FALLBACK):
                  try:
                      return Image.open(BytesIO(fetch(src))).convert('RGB'), src
                  except Exception as e:
                      print(f"::warning::{im['name']}: source KO ({src[:70]}) -> {e}")
              print(f"::warning::{im['name']}: fallback local {LOCAL_FALLBACK}")
              return Image.open(LOCAL_FALLBACK).convert('RGB'), LOCAL_FALLBACK

          def save_webp(img, width, dest):
              if img.width > width:
                  h = round(img.height * width / img.width)
                  img = img.resize((width, h), Image.LANCZOS)
              img.save(dest, 'WEBP', quality=82, method=6)
              kb = os.path.getsize(dest) // 1024
              print(f"  -> {dest} ({img.width}px, {kb} Ko)")

          changed = []
          for im in recap['images']:
              name = im['name']
              img, used = load_image(im)
              print(f"{name}: source utilisée {used[:70]}")
              dest = os.path.join(out_dir, f'{name}.webp')
              save_webp(img, WIDTHS.get(name, DEFAULT_WIDTH), dest)
              changed.append(dest)
              if name in THUMB:
                  tname, twidth = THUMB[name]
                  tdest = os.path.join(out_dir, f'{tname}.webp')
                  save_webp(img, twidth, tdest)
                  changed.append(tdest)

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'Vinyl Run Agent'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'magazine@vinyl-run.com'], check=True)
              subprocess.run(['git', 'add'] + changed, check=True)
              if subprocess.run(['git', 'diff', '--staged', '--quiet']).returncode != 0:
                  subprocess.run(['git', 'commit', '-m', f'feat(blog): images {slug}'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'main'], check=True)
                  print('Images committées et poussées.')
              else:
                  print('Aucun changement d\'image.')
          EOF

      # Le push ci-dessus est fait par github-actions[bot] : Vercel n'émet PAS de
      # déploiement pour ce push. On déclenche donc explicitement un redéploiement
      # via un Deploy Hook Vercel (sinon les images restent en 404 jusqu'au prochain
      # push d'un utilisateur réel).
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Déploiement Vercel déclenché."
          else
            echo "::warning::VERCEL_DEPLOY_HOOK absent — Vercel ne redéploiera pas tout seul. Crée un Deploy Hook Vercel et ajoute le secret VERCEL_DEPLOY_HOOK."
          fi
